<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="generator" content="Phúc Nguyên Studio">
<title>{{TITLE}}</title>
<style>
:root{--navy:#102c43;--navy2:#1f4a6c;--gold:#c4a578;--gold2:#f6efe3;--line:#dde4eb;--bg:#f4f6f9;--ok:#1f7a4d;--okb:#e5f3ea;--err:#b3261e;--errb:#fde8e6;--muted:#5b7286}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:16px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:#14283a;display:flex;flex-direction:column}
a{color:var(--navy2)}button{font:inherit}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex:none}
.top b{letter-spacing:.06em;font-size:.85rem;color:var(--gold)}.top .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .menu{display:none;background:none;border:1px solid #ffffff55;color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}
.bar{height:6px;background:#ffffff22;border-radius:9px;overflow:hidden;width:160px;margin-left:auto;flex:none}.bar i{display:block;height:100%;background:var(--gold);width:0}
.pct{font-size:.85rem;color:#dbe6ef;flex:none}
.wrap{flex:1;display:flex;min-height:0}
nav{width:300px;flex:none;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:14px 10px}
nav button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:#14283a}
nav button:hover{background:#eef2f6}nav button[aria-current=page]{background:var(--gold2);font-weight:600}
nav .st{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #b7c4d1;display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;margin-top:2px}
nav .st.part{border-color:var(--gold);background:linear-gradient(90deg,var(--gold) 50%,transparent 50%)}nav .st.done{border-color:var(--ok);background:var(--ok);color:#fff}
nav small{display:block;color:var(--muted);font-weight:400}
nav h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 10px 6px}
main{flex:1;overflow:auto;padding:26px clamp(14px,4vw,44px)}
.inner{max-width:1050px;margin:0 auto}
h1{color:var(--navy);font-size:1.6rem;line-height:1.3;margin:0 0 6px}h2{color:var(--navy);font-size:1.15rem}
.meta{color:var(--muted);margin:0 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0 0 16px}
.cover{width:100%;max-height:340px;object-fit:cover;border-radius:12px;margin-bottom:16px;display:block}
.btn{display:inline-block;font-weight:600;padding:9px 18px;border-radius:8px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer;text-decoration:none}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}.btn.ghost{background:#fff;color:var(--navy)}
.btn:focus-visible,.opt:focus-visible,nav button:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stage{position:relative;background:#000;border-radius:12px;overflow:hidden}video{width:100%;display:block;max-height:72vh}
.ov{position:absolute;inset:0;background:rgba(16,44,67,.93);display:flex;align-items:center;justify-content:center;padding:18px}.ov[hidden]{display:none}
.q{background:#fff;border-radius:12px;max-width:680px;width:100%;padding:20px;max-height:100%;overflow:auto}
.opt{display:block;width:100%;text-align:left;padding:10px 14px;margin:8px 0;border:1px solid #c7d2df;border-radius:8px;background:#fff;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.bad{border-color:var(--err);background:var(--errb)}
.fb{margin:10px 0 0;padding:10px 12px;border-radius:8px;background:var(--gold2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{font-size:.85rem;padding:4px 12px;border-radius:99px;background:#e9eef3;color:var(--navy2);border:0;cursor:pointer}
.chip.on{background:var(--navy);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 0}
.tab{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent}.tab[aria-selected=true]{color:var(--navy);border-color:var(--gold);font-weight:600}
.pane{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:16px 20px}
.pane h3{font-size:1rem;color:var(--navy);margin:14px 0 4px}.pane p{margin:4px 0 10px;white-space:pre-wrap}
.note{font-size:.88rem;color:var(--muted)}.ok{color:var(--ok)}.err{color:var(--err)}
.ai{display:inline-block;font-size:.78rem;background:var(--gold2);color:#7a5a2a;border-radius:99px;padding:2px 10px}
.qz{margin:0 0 18px;padding:0 0 14px;border-bottom:1px dashed var(--line)}.qz:last-child{border:0}
.qz label{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:8px;cursor:pointer}.qz label:hover{background:#f3f6f9}
.qz label.ok{background:var(--okb)}.qz label.bad{background:var(--errb)}
.result{font-size:1.2rem;font-weight:700}
ul.files{list-style:none;padding:0;margin:0}ul.files li{padding:8px 0;border-bottom:1px solid var(--line)}
@media (max-width:860px){nav{position:fixed;top:48px;bottom:0;left:0;z-index:5;box-shadow:0 0 30px #0003;display:none}nav.open{display:block}.top .menu{display:inline-block}.bar{width:80px}}
@media print{nav,.top,.stage,.chips,.tabs{display:none}}
</style>
</head>
<body>
<div class="top"><button class="menu" id="menu" aria-label="Mục lục">☰</button><b>PHÚC NGUYÊN STUDIO</b><span class="t" id="ttl"></span>
  <span class="bar" aria-hidden="true"><i id="bar"></i></span><span class="pct" id="pct"></span></div>
<div class="wrap"><nav id="nav" aria-label="Mục lục học liệu"></nav><main id="main" tabindex="-1"><div class="inner" id="view"></div></main></div>
<script type="application/json" id="pns-course">{{DATA}}</script>
<script src="{{PLAYER}}"></script>
</body>
</html>
